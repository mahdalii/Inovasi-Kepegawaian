<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sistem Cuti{% endblock %} — Sekretariat Bapenda Prov Kepri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
